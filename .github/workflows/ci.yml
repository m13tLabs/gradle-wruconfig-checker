name: CI

on:
  push:
    branches: [develop]
  pull_request:
  merge_group:
  # allow manual action run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: ignore

  # Single aggregate check - make THIS the only required status check in branch
  # protection. It passes only when every other job succeeded; add new jobs to
  # `needs` as they are introduced.
  build-results:
    name: Build results
    if: always()
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Verify all jobs succeeded
        # see https://stackoverflow.com/a/67532120/4907315
        if: >-
          ${{
            contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
            || contains(needs.*.result, 'skipped')
          }}
        run: |
          echo "One or more jobs did not succeed:"
          echo '${{ toJSON(needs) }}'
          exit 1
